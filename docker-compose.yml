services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lmgestao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: lmgestao
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmgestao -d lmgestao"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    environment:
      PGHOST: db
      PGUSER: lmgestao
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: lmgestao
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no .env}
      ADMIN1_EMAIL: ${ADMIN1_EMAIL:?Defina ADMIN1_EMAIL}
      ADMIN1_PASSWORD: ${ADMIN1_PASSWORD:?Defina ADMIN1_PASSWORD}
      PORT: 3001
      SECURE_COOKIES: "false"
      ALERT_EXPENSE_LIMIT_CENTS: ${ALERT_EXPENSE_LIMIT_CENTS:-300000}
      AUTOMATION_TOKEN: ${AUTOMATION_TOKEN:-}
      N8N_ALERT_WEBHOOK_URL: ${N8N_ALERT_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: ["automation"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  postgres_data:
  uploads:
  n8n_data:
